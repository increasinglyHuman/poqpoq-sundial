name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      # The demo's default outDir is dist/, the package's; keep them apart.
      - name: Build the demo
        run: npx vite build --outDir demo-dist
      - name: Build the package
        run: npm run build
      - name: Check the package contents
        run: npm pack --dry-run
# The GPU checks (npm run test:consumer, scripts/bench.mjs) need real Chrome
# with WebGPU on a GPU, so they run locally before each merge, not here.
